version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
  settings:
    staticcheck:
      # Gate correctness without requiring unrelated style rewrites.
      checks: ["SA*"]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
